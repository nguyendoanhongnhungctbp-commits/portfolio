<!DOCTYPE html>
<html>
<head>
<style>
body{margin:0;background:var(--color-bg-100,#f8fafc);overflow:auto}
svg{display:block}
.task{fill:#fff;stroke:#64748b;stroke-width:1.2}
.task-sys{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.2}
.task-warn{fill:#fff7ed;stroke:#f97316;stroke-width:1.2}
.task-leave{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.2}
.gateway{fill:#fefce8;stroke:#ca8a04;stroke-width:1.3}
.ev-start{fill:#fff;stroke:#334155;stroke-width:1.5}
.ev-end{fill:#334155;stroke:#334155;stroke-width:4}
.ev-timer{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.5}
.ev-inter{fill:#fff;stroke:#3b82f6;stroke-width:1.5}
.ln{stroke:#64748b;stroke-width:1.2;fill:none;marker-end:url(#arr)}
.ln-or{stroke:#f97316;stroke-width:1.2;fill:none;marker-end:url(#arr-or)}
.ln-green{stroke:#16a34a;stroke-width:1.2;fill:none;marker-end:url(#arr-g)}
.lbl{font-size:9px;fill:#64748b}
.tlbl{font-size:9.5px;fill:#1e293b;text-anchor:middle;dominant-baseline:middle}
.tlbl-s{font-size:8.5px;fill:#1e293b;text-anchor:middle;dominant-baseline:middle}
.lane-lbl{font-size:11px;font-weight:600;fill:#475569;writing-mode:tb;text-anchor:middle}
.section-lbl{font-size:9px;fill:#94a3b8;text-anchor:middle}
.note{fill:#fefce8;stroke:#ca8a04;stroke-width:1;stroke-dasharray:3 2}
</style>
</head>
<body>
<svg width="2060" height="660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
  </marker>
  <marker id="arr-or" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
  </marker>
  <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
  </marker>
</defs>

<!-- ══ POOL BORDER ══ -->
<rect x="38" y="42" width="2000" height="600" rx="4" fill="none" stroke="#334155" stroke-width="1.8"/>

<!-- Pool label -->
<rect x="38" y="42" width="28" height="600" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
<text x="52" y="342" class="lane-lbl">Time App — Chấm Công</text>

<!-- Lane divider -->
<line x1="66" y1="280" x2="2038" y2="280" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Lane labels -->
<rect x="66" y="42" width="24" height="238" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="78" y="161" class="lane-lbl">Người dùng</text>
<rect x="66" y="280" width="24" height="362" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="78" y="461" class="lane-lbl">Hệ thống</text>

<!-- ══════════════════════════════════════════════
     SECTION 1 — DAILY REMINDER (x≈100-360)
══════════════════════════════════════════════ -->
<text x="230" y="60" class="section-lbl">① Nhắc nhở hàng ngày</text>

<!-- Timer start event (sys) -->
<circle cx="120" cy="430" r="18" class="ev-timer"/>
<text x="120" y="426" class="tlbl-s">⏰</text>
<text x="120" y="436" class="tlbl-s">timer</text>
<text x="120" y="458" class="lbl" text-anchor="middle">Giờ cấu hình</text>
<text x="120" y="468" class="lbl" text-anchor="middle">(mặc định 08:45)</text>

<!-- Arrow → check -->
<line x1="138" y1="430" x2="178" y2="430" class="ln"/>

<!-- Task: Check already checked-in? -->
<rect x="178" y="410" width="120" height="40" rx="6" class="task-sys"/>
<text x="238" y="427" class="tlbl">Đã check-in</text>
<text x="238" y="438" class="tlbl">hôm nay?</text>

<!-- Arrow → gateway -->
<line x1="298" y1="430" x2="330" y2="430" class="ln"/>

<!-- Gateway X -->
<polygon points="350,410 370,430 350,450 330,430" class="gateway"/>
<text x="350" y="433" class="tlbl" style="font-size:11px">×</text>

<!-- Yes branch → end (skip) -->
<line x1="350" y1="410" x2="350" y2="370" class="ln"/>
<circle cx="350" cy="352" r="14" class="ev-end"/>
<text x="370" y="372" class="lbl">Đã có, bỏ qua</text>

<!-- No branch → send reminder -->
<line x1="370" y1="430" x2="408" y2="430" class="ln"/>
<text x="386" y="424" class="lbl">Chưa</text>

<!-- Task: Send reminder -->
<rect x="408" y="410" width="120" height="40" rx="6" class="task-sys"/>
<text x="468" y="427" class="tlbl">Gửi thông báo</text>
<text x="468" y="438" class="tlbl">"Đã check-in chưa?"</text>

<!-- ══════════════════════════════════════════════
     SECTION 2 — USER SELECTS SHIFT (x≈560-680)
══════════════════════════════════════════════ -->
<text x="620" y="60" class="section-lbl">② Chọn ca</text>

<!-- User: Select shift -->
<rect x="548" y="142" width="120" height="40" rx="6" class="task"/>
<text x="608" y="159" class="tlbl">Chọn ca /</text>
<text x="608" y="170" class="tlbl">Mở app</text>

<!-- Gateway: shift type -->
<polygon points="700,142 724,162 700,182 676,162" class="gateway"/>
<text x="700" y="165" class="tlbl" style="font-size:10px">×</text>
<text x="700" y="195" class="lbl" text-anchor="middle">Ca làm?</text>

<!-- Arrow from notification to user (cross-lane) -->
<line x1="468" y1="410" x2="468" y2="162" class="ln" stroke-dasharray="5 3" stroke="#3b82f6"/>
<line x1="468" y1="162" x2="548" y2="162" class="ln" stroke="#3b82f6" stroke-dasharray="5 3"/>
<text x="490" y="290" class="lbl" fill="#3b82f6">user nhận &amp; mở app</text>

<!-- Arrow user → gateway -->
<line x1="668" y1="162" x2="676" y2="162" class="ln"/>

<!-- ══════════════════════════════════════════════
     SECTION 3 — MORNING SHIFT (x≈740-1100)
══════════════════════════════════════════════ -->
<text x="900" y="60" class="section-lbl">③ Ca Sáng (8h NET)</text>
<rect x="738" y="48" width="390" height="4" fill="#4ade80" opacity="0.5" rx="2"/>

<!-- Gateway → Morning (up) -->
<line x1="700" y1="142" x2="700" y2="112" class="ln"/>
<line x1="700" y1="112" x2="780" y2="112" class="ln"/>
<text x="730" y="108" class="lbl">Ca Sáng</text>

<!-- User: Confirm Check-in -->
<rect x="780" y="92" width="120" height="40" rx="6" class="task"/>
<text x="840" y="109" class="tlbl">Xác nhận</text>
<text x="840" y="120" class="tlbl">Check In</text>

<!-- Arrow user → system (cross-lane) -->
<line x1="840" y1="132" x2="840" y2="390" class="ln"/>

<!-- System: Record check-in -->
<rect x="780" y="390" width="120" height="40" rx="6" class="task-sys"/>
<text x="840" y="407" class="tlbl">Ghi nhận</text>
<text x="840" y="418" class="tlbl">check-in timestamp</text>

<!-- Arrow → start countdown -->
<line x1="900" y1="410" x2="928" y2="410" class="ln"/>

<!-- System: Start 8h countdown -->
<rect x="928" y="390" width="110" height="40" rx="6" class="task-sys"/>
<text x="983" y="407" class="tlbl">Bắt đầu đếm</text>
<text x="983" y="418" class="tlbl">8h NET</text>

<!-- Lunch break timer (12:00) -->
<line x1="983" y1="430" x2="983" y2="470" class="ln-or"/>
<circle cx="983" cy="480" r="12" class="ev-inter" stroke="#f97316"/>
<text x="983" y="484" class="tlbl-s" fill="#f97316">12:00</text>

<!-- Task: Lunch Pause -->
<rect x="920" y="502" width="126" height="40" rx="6" class="task-warn"/>
<text x="983" y="519" class="tlbl">Dừng ring (màu cam)</text>
<text x="983" y="530" class="tlbl">"Lunch Time"</text>

<!-- Resume timer (13:00) -->
<line x1="983" y1="480" x2="1046" y2="480" class="ln-or" stroke-dasharray="4 3"/>
<circle cx="1056" cy="480" r="12" class="ev-inter" stroke="#f97316"/>
<text x="1056" y="484" class="tlbl-s" fill="#f97316">13:00</text>
<line x1="1056" y1="468" x2="1056" y2="432" class="ln-or"/>

<!-- Arrow back to countdown -->
<rect x="998" y="390" width="0" height="0"/>
<text x="1040" y="445" class="lbl" fill="#f97316">Tiếp tục</text>

<!-- Timer 7h NET -->
<line x1="840" y1="430" x2="840" y2="540" class="ln"/>
<circle cx="840" cy="550" r="12" class="ev-inter"/>
<text x="840" y="554" class="tlbl-s">7h NET</text>

<!-- Send 1h remaining -->
<rect x="770" y="572" width="140" height="36" rx="6" class="task-sys"/>
<text x="840" y="586" class="tlbl">Gửi "Còn 1 giờ"</text>
<text x="840" y="597" class="tlbl-s">(Morning: 7h NET đạt)</text>

<!-- Timer 60 min (→ 8h) -->
<line x1="840" y1="608" x2="840" y2="624" class="ln"/>
<circle cx="840" cy="632" r="10" class="ev-inter"/>
<text x="840" y="635" class="tlbl-s">60ph</text>
<line x1="850" y1="632" x2="910" y2="632" class="ln"/>

<!-- Send shift complete -->
<rect x="910" y="618" width="140" height="28" rx="6" class="task-sys"/>
<text x="980" y="635" class="tlbl">"Hoàn thành ca, check out?"</text>

<!-- ══════════════════════════════════════════════
     SECTION 4 — AFTERNOON SHIFT (x≈1140-1360)
══════════════════════════════════════════════ -->
<text x="1250" y="60" class="section-lbl">④ Ca Chiều (4h NET)</text>
<rect x="1138" y="48" width="250" height="4" fill="#60a5fa" opacity="0.5" rx="2"/>

<!-- Gateway → Afternoon -->
<line x1="724" y1="162" x2="1160" y2="162" class="ln"/>
<text x="920" y="158" class="lbl">Ca Chiều</text>

<!-- Gateway: before 12:00? -->
<polygon points="1180,142 1204,162 1180,182 1156,162" class="gateway"/>
<text x="1180" y="165" class="tlbl" style="font-size:10px">×</text>
<text x="1180" y="194" class="lbl" text-anchor="middle">Trước 12:00?</text>

<!-- Yes → disable button, show countdown -->
<line x1="1180" y1="142" x2="1180" y2="105" class="ln"/>
<rect x="1118" y="68" width="124" height="34" rx="6" class="task-warn"/>
<text x="1180" y="82" class="tlbl">Vô hiệu hoá Check-in</text>
<text x="1180" y="93" class="tlbl">Hiện đếm ngược → 12:00</text>
<text x="1148" y="58" class="lbl">Có (trước 12:00)</text>
<!-- timer arc back -->
<line x1="1180" y1="102" x2="1204" y2="102" class="ln-or" stroke-dasharray="3 2"/>
<line x1="1204" y1="102" x2="1204" y2="162" class="ln-or" stroke-dasharray="3 2"/>
<text x="1210" y="130" class="lbl" fill="#f97316">12:00 →</text>

<!-- No → confirm check-in -->
<line x1="1204" y1="162" x2="1244" y2="162" class="ln"/>
<text x="1220" y="157" class="lbl">Không</text>

<!-- User: Confirm check-in afternoon -->
<rect x="1244" y="142" width="120" height="40" rx="6" class="task"/>
<text x="1304" y="159" class="tlbl">Xác nhận</text>
<text x="1304" y="170" class="tlbl">Check In (≥12:00)</text>

<!-- Cross-lane to system -->
<line x1="1304" y1="182" x2="1304" y2="390" class="ln"/>

<!-- System: Record check-in afternoon -->
<rect x="1244" y="390" width="120" height="40" rx="6" class="task-sys"/>
<text x="1304" y="407" class="tlbl">Ghi nhận</text>
<text x="1304" y="418" class="tlbl">check-in timestamp</text>

<!-- Start 4h countdown -->
<line x1="1304" y1="430" x2="1304" y2="470" class="ln"/>
<rect x="1244" y="470" width="120" height="36" rx="6" class="task-sys"/>
<text x="1304" y="485" class="tlbl">Bắt đầu đếm</text>
<text x="1304" y="496" class="tlbl">4h NET</text>

<!-- Timer 3h NET -->
<line x1="1304" y1="506" x2="1304" y2="540" class="ln"/>
<circle cx="1304" cy="550" r="12" class="ev-inter"/>
<text x="1304" y="554" class="tlbl-s">3h NET</text>

<!-- Send 1h remaining -->
<rect x="1234" y="572" width="140" height="36" rx="6" class="task-sys"/>
<text x="1304" y="586" class="tlbl">Gửi "Còn 1 giờ"</text>
<text x="1304" y="597" class="tlbl-s">(Afternoon: 3h NET đạt)</text>
<line x1="1304" y1="562" x2="1304" y2="572" class="ln"/>

<!-- Timer 60 min -->
<line x1="1304" y1="608" x2="1304" y2="624" class="ln"/>
<circle cx="1304" cy="632" r="10" class="ev-inter"/>
<text x="1304" y="635" class="tlbl-s">60ph</text>
<line x1="1314" y1="632" x2="1370" y2="632" class="ln"/>

<!-- Send shift complete afternoon -->
<rect x="1370" y="618" width="130" height="28" rx="6" class="task-sys"/>
<text x="1435" y="635" class="tlbl">"Hoàn thành ca, check out?"</text>

<!-- ══════════════════════════════════════════════
     SECTION 5 — LEAVE DAY (x≈1520-1660)
══════════════════════════════════════════════ -->
<text x="1580" y="60" class="section-lbl">⑤ Nghỉ phép</text>

<!-- Gateway → Leave -->
<line x1="700" y1="182" x2="700" y2="212" class="ln"/>
<line x1="700" y1="212" x2="1540" y2="212" class="ln"/>
<text x="1100" y="208" class="lbl">Nghỉ (Leave)</text>

<!-- User: Confirm Leave -->
<rect x="1518" y="192" width="110" height="38" rx="6" class="task-leave"/>
<text x="1573" y="209" class="tlbl">Xác nhận</text>
<text x="1573" y="220" class="tlbl">Leave Day</text>

<!-- Cross-lane to system -->
<line x1="1573" y1="230" x2="1573" y2="390" class="ln"/>

<!-- System: Record leave -->
<rect x="1513" y="390" width="120" height="36" rx="6" class="task-sys"/>
<text x="1573" y="405" class="tlbl">Ghi nhận</text>
<text x="1573" y="416" class="tlbl">Full Day Leave</text>

<!-- Cancel reminders -->
<line x1="1573" y1="426" x2="1573" y2="456" class="ln"/>
<rect x="1513" y="456" width="120" height="36" rx="6" class="task-warn"/>
<text x="1573" y="471" class="tlbl">Huỷ tất cả</text>
<text x="1573" y="482" class="tlbl">nhắc nhở hôm nay</text>

<!-- Update status = Leave -->
<line x1="1573" y1="492" x2="1573" y2="522" class="ln"/>
<rect x="1513" y="522" width="120" height="36" rx="6" class="task-sys"/>
<text x="1573" y="537" class="tlbl">Cập nhật trạng thái</text>
<text x="1573" y="548" class="tlbl">= Leave</text>

<!-- End event -->
<line x1="1573" y1="558" x2="1573" y2="592" class="ln"/>
<circle cx="1573" cy="605" r="14" fill="#334155" stroke="#334155" stroke-width="3"/>

<!-- ══════════════════════════════════════════════
     SECTION 6 — 18:00 CHECK (x≈1700-1820)
══════════════════════════════════════════════ -->
<text x="1750" y="60" class="section-lbl">⑥ 18:00 check</text>

<!-- Timer 18:00 -->
<circle cx="1700" cy="430" r="16" class="ev-timer"/>
<text x="1700" y="427" class="tlbl-s">⏰</text>
<text x="1700" y="437" class="tlbl-s">18:00</text>

<line x1="1716" y1="430" x2="1748" y2="430" class="ln"/>

<!-- Gateway: checked-in AND not checked-out? -->
<polygon points="1770,410 1794,430 1770,450 1746,430" class="gateway"/>
<text x="1770" y="433" class="tlbl" style="font-size:10px">×</text>
<text x="1770" y="462" class="lbl" text-anchor="middle">Đã check-in</text>
<text x="1770" y="472" class="lbl" text-anchor="middle">&amp; chưa check-out?</text>

<!-- Yes → send 18:00 prompt -->
<line x1="1794" y1="430" x2="1834" y2="430" class="ln"/>
<text x="1810" y="425" class="lbl">Có</text>
<rect x="1834" y="410" width="130" height="40" rx="6" class="task-sys"/>
<text x="1899" y="427" class="tlbl">Gửi "Bạn muốn</text>
<text x="1899" y="438" class="tlbl">check out không?"</text>

<!-- No → end (skip) -->
<line x1="1770" y1="450" x2="1770" y2="490" class="ln"/>
<circle cx="1770" cy="502" r="10" fill="#94a3b8" stroke="#94a3b8" stroke-width="2"/>
<text x="1770" y="520" class="lbl" text-anchor="middle">Không / đã checkout</text>

<!-- ══════════════════════════════════════════════
     SECTION 7 — CHECK-OUT (x≈1700-1920) USER LANE
══════════════════════════════════════════════ -->
<text x="1850" y="60" class="section-lbl">⑦ Check-out</text>

<!-- User: Tap Check Out -->
<rect x="1834" y="142" width="120" height="40" rx="6" class="task"/>
<text x="1894" y="159" class="tlbl">Tap</text>
<text x="1894" y="170" class="tlbl">Check Out</text>

<!-- Cross-lane -->
<line x1="1894" y1="182" x2="1894" y2="320" class="ln"/>

<!-- System: Record check-out -->
<rect x="1834" y="320" width="120" height="36" rx="6" class="task-sys"/>
<text x="1894" y="335" class="tlbl">Ghi nhận</text>
<text x="1894" y="346" class="tlbl">check-out timestamp</text>

<!-- Calc GROSS & NET -->
<line x1="1894" y1="356" x2="1894" y2="378" class="ln"/>
<rect x="1834" y="378" width="120" height="36" rx="6" class="task-sys"/>
<text x="1894" y="393" class="tlbl">Tính GROSS &amp; NET</text>
<text x="1894" y="404" class="tlbl-s">GROSS=out−in / NET=GROSS−1h</text>

<!-- Update status = Completed -->
<line x1="1894" y1="414" x2="1894" y2="438" class="ln"/>
<rect x="1834" y="438" width="120" height="36" rx="6" class="task-sys"/>
<text x="1894" y="453" class="tlbl">Cập nhật trạng thái</text>
<text x="1894" y="464" class="tlbl">= Completed</text>

<!-- End event -->
<line x1="1894" y1="474" x2="1894" y2="508" class="ln"/>
<circle cx="1894" cy="522" r="14" fill="#334155" stroke="#334155" stroke-width="3"/>

<!-- ══ CONNECT checkout from morning/afternoon reminders (dotted) ══ -->
<line x1="1899" y1="450" x2="1834" y2="450" class="ln" stroke="#334155" stroke-dasharray="5 3"/>

<!-- Note box -->
<rect x="68" y="290" width="200" height="28" rx="4" class="note"/>
<text x="168" y="308" class="lbl" text-anchor="middle">* Giờ nhắc nhở do user cấu hình (default 08:45)</text>

<!-- Legend -->
<rect x="68" y="625" width="500" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<rect x="78" y="632" width="14" height="12" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
<text x="98" y="642" class="lbl">Hệ thống</text>
<rect x="148" y="632" width="14" height="12" rx="2" fill="#fff7ed" stroke="#f97316" stroke-width="1"/>
<text x="168" y="642" class="lbl">Cảnh báo/Tạm dừng</text>
<rect x="248" y="632" width="14" height="12" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
<text x="268" y="642" class="lbl">Nghỉ phép</text>
<rect x="318" y="632" width="14" height="12" rx="2" fill="#fff" stroke="#64748b" stroke-width="1"/>
<text x="338" y="642" class="lbl">Hành động người dùng</text>
<rect x="438" y="632" width="14" height="12" rx="2" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
<text x="458" y="642" class="lbl">Gateway</text>

</svg>
</body>
</html>
